<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Payment</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f7f5;margin:0;color:#172033}.box{max-width:560px;margin:45px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001}.badge{display:inline-block;background:#e8f7ef;color:#087b52;padding:7px 11px;border-radius:20px;font-weight:700}.info{background:#f5f7fa;padding:15px;border-radius:10px;margin:18px 0;line-height:1.7}.btn{background:#087b52;color:#fff;border:0;padding:14px 20px;border-radius:9px;font-weight:700;cursor:pointer;width:100%;font-size:16px}.msg{margin-top:18px;font-weight:700;line-height:1.6}.error{background:#fff1f1;padding:14px;border-radius:10px;color:#9b1c1c}</style></head><body><div class="box"><h1>BankSaathi Payment</h1><span class="badge">Secure Payment</span><div id="content"></div><div class="msg" id="msg"></div></div><script>const q=new URLSearchParams(location.search),appId=q.get('application_id'),amt=Number(q.get('amount')||1);const content=document.getElementById('content');if(!appId){content.innerHTML='<div class="error"><b>Application ID नहीं मिला.</b><br><br>Payment page को सीधे खोलने की जरूरत नहीं है.<br>पहले Customer Application submit करें, फिर <b>Payment करें</b> button दबाएँ.</div>'}else{content.innerHTML='<div class="info"><b>Application ID:</b> '+appId+'<br><b>Payment Amount:</b> ₹'+amt.toFixed(2)+'<br><br>Application ID अपने-आप मिल गई है. आपको कुछ भी भरना नहीं है.</div><button class="btn" id="pay">Proceed to Secure Payment</button>';pay.onclick=async()=>{pay.disabled=true;msg.textContent='Secure payment page बनाया जा रहा है...';try{const r=await fetch('/api/create-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:appId,amount:amt})});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Payment शुरू नहीं हो सका';pay.disabled=false;return}msg.innerHTML='<div class="info"><b>Payment page तैयार है.</b><br><a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+j.short_url+'">Open Secure Payment</a></div>'}catch(e){msg.textContent='Payment link नहीं बन पाया';pay.disabled=false}}}</script></body></html>
