<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Payment</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f7f5;margin:0;color:#172033}.box{max-width:560px;margin:45px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001}.badge{display:inline-block;background:#e8f7ef;color:#087b52;padding:7px 11px;border-radius:20px;font-weight:700}.info{background:#f5f7fa;padding:15px;border-radius:10px;margin:18px 0;line-height:1.7}.btn{display:block;width:100%;background:#087b52;color:#fff;border:0;padding:14px 20px;border-radius:9px;font-weight:700;cursor:pointer;font-size:16px;margin-top:12px}.btn.alt{background:#145da0}.msg{margin-top:18px;font-weight:700;line-height:1.6}.error{background:#fff1f1;padding:14px;border-radius:10px;color:#9b1c1c}.sub{font-size:13px;color:#667085;margin-top:12px}</style></head><body><div class="box"><h1>BankSaathi Payment</h1><span class="badge">Secure Payment</span><div id="content"></div><div class="msg" id="msg"></div></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const q=new URLSearchParams(location.search),appId=q.get('application_id'),amt=Number(q.get('amount')||1);const content=document.getElementById('content');if(!appId){content.innerHTML='<div class="error"><b>Application ID नहीं मिला.</b><br><br>पहले Customer Application submit करें, फिर Payment करें.</div>'}else{content.innerHTML='<div class="info"><b>Application ID:</b> '+appId+'<br><b>Payment Amount:</b> ₹'+amt.toFixed(2)+'<br><span class="sub">Application ID अपने-आप मिल गई है. आपको कुछ भी भरना नहीं है.</span></div><button class="btn" id="rzp">Pay with Razorpay</button><button class="btn alt" id="link">Open Payment Link</button>';rzp.onclick=async()=>{rzp.disabled=true;link.disabled=true;msg.textContent='Razorpay checkout तैयार हो रहा है...';try{const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:appId,amount:amt})});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Razorpay payment शुरू नहीं हो सका';rzp.disabled=false;link.disabled=false;return}new Razorpay({key:j.key_id,amount:j.amount,currency:'INR',name:'BankSaathi',description:'BankSaathi Application Payment',order_id:j.order_id,prefill:{name:j.name,email:j.email,contact:j.phone},handler:async response=>{msg.textContent='Payment verify हो रहा है...';const vr=await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,application_id:appId})});const v=await vr.json();msg.textContent=v.verified&&v.paid?'Payment सफल है। Application Paid हो गया है.':(v.message||'Payment verification pending है.');rzp.disabled=false;link.disabled=false},modal:{ondismiss:()=>{rzp.disabled=false;link.disabled=false}}}).open()}catch(e){msg.textContent='Razorpay payment शुरू नहीं हो सका';rzp.disabled=false;link.disabled=false}};link.onclick=async()=>{rzp.disabled=true;link.disabled=true;msg.textContent='Secure Payment Link बनाया जा रहा है...';try{const r=await fetch('/api/create-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:appId,amount:amt})});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Payment Link नहीं बन पाया';rzp.disabled=false;link.disabled=false;return}window.location.href=j.short_url}catch(e){msg.textContent='Payment Link नहीं बन पाया';rzp.disabled=false;link.disabled=false}}}</script></body></html>
