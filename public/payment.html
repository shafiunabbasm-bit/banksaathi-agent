<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Payment</title><style>body{font-family:Arial;background:#f3f7f5;margin:0}.box{max-width:560px;margin:60px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001}.badge{display:inline-block;background:#e8f7ef;padding:7px 11px;border-radius:20px;font-weight:700}.btn{background:#087b52;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:700}input{padding:12px;width:100%;box-sizing:border-box;margin:8px 0 15px;border:1px solid #ccc;border-radius:8px}.msg{margin-top:18px;font-weight:700;line-height:1.5}</style><div class="box"><h1>BankSaathi Payment</h1><span class="badge">Razorpay Secure Checkout</span><p>Application ID</p><input id="id" placeholder="Application ID"><p>Amount (INR)</p><input id="amount" type="number" min="1" step="0.01" placeholder="Amount"><button class="btn" id="pay">Pay Securely</button><div class="msg" id="msg"></div></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const q=new URLSearchParams(location.search);if(q.get('application_id'))id.value=q.get('application_id');if(q.get('amount'))amount.value=q.get('amount');document.getElementById('pay').onclick=async()=>{msg.textContent='Razorpay order बनाया जा रहा है...';try{const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:id.value.trim(),amount:Number(amount.value)})});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Payment शुरू नहीं हो सका';return}const options={key:j.key_id,amount:j.amount,currency:'INR',name:'BankSaathi',description:'BankSaathi Application',order_id:j.order_id,prefill:{name:j.name,email:j.email,contact:j.phone},handler:async function(response){msg.textContent='Payment verify हो रहा है...';const vr=await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,application_id:j.application_id})});const v=await vr.json();if(v.verified&&v.paid){msg.textContent='Payment सफल है। Application status Paid हो गया है.';setTimeout(()=>location.href='/status.html?id='+encodeURIComponent(j.application_id),900)}else{msg.textContent=v.message||'Payment verification pending है।'}},theme:{color:'#087b52'}};const rzp=new Razorpay(options);rzp.on('payment.failed',function(){msg.textContent='Payment failed. कृपया फिर प्रयास करें।'});rzp.open();}catch(e){msg.textContent='Payment शुरू नहीं हो सका';}};</script></html>
