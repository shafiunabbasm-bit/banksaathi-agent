<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Payment</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f7f5;margin:0;color:#172033}.box{max-width:560px;margin:45px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001}.badge{display:inline-block;background:#e8f7ef;color:#087b52;padding:7px 11px;border-radius:20px;font-weight:700}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}input{padding:12px;width:100%;border:1px solid #ccd5d0;border-radius:8px;font-size:15px}.btn{background:#087b52;color:#fff;border:0;padding:14px 20px;border-radius:9px;font-weight:700;cursor:pointer;width:100%;font-size:16px}.btn:disabled{opacity:.55}.note{background:#f5f7fa;padding:13px;border-radius:10px;margin:18px 0;line-height:1.5}.msg{margin-top:18px;font-weight:700;line-height:1.6}.success{background:#eef8f2;padding:14px;border-radius:10px}.link{display:inline-block;margin-top:10px;background:#087b52;color:white;text-decoration:none;padding:12px 16px;border-radius:8px}</style></head><body><div class="box"><h1>BankSaathi Payment</h1><span class="badge">Secure Payment</span><div class="field"><label>Application ID</label><input id="id" placeholder="Application ID"></div><div class="field"><label>Amount (INR)</label><input id="amount" type="number" min="1" step="0.01" placeholder="Amount"></div><div class="note">Payment button दबाने पर secure Razorpay payment page खुलेगा. वहाँ उपलब्ध UPI, card और net banking options से payment किया जा सकता है.</div><button class="btn" id="pay">Proceed to Secure Payment</button><div class="msg" id="msg"></div></div><script>const q=new URLSearchParams(location.search);id.value=q.get('application_id')||'';amount.value=q.get('amount')||'1';pay.onclick=async()=>{const appId=id.value.trim(),amt=Number(amount.value);if(!appId||!Number.isFinite(amt)||amt<1){msg.textContent='Application ID और valid amount डालें';return}pay.disabled=true;msg.textContent='Secure payment page बनाया जा रहा है...';try{const r=await fetch('/api/create-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:appId,amount:amt})});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Payment शुरू नहीं हो सका';pay.disabled=false;return}msg.innerHTML='<div class="success">Payment page तैयार है.<br><a class="link" target="_blank" rel="noopener" href="'+j.short_url+'">Open Secure Payment</a></div>'}catch(e){msg.textContent='Payment link नहीं बन पाया';pay.disabled=false}};</script></body></html>
