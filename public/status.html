<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Application Status</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#13231c}.top{background:#063b2b;color:#fff;padding:18px 6%;font-size:25px;font-weight:800}.wrap{max-width:700px;margin:45px auto;padding:20px}.box{background:#fff;padding:28px;border-radius:18px;box-shadow:0 4px 18px #0001}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.btn{background:#0b7a53;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:700;cursor:pointer}.row{padding:10px 0;border-bottom:1px solid #eee}.ok{font-weight:700}</style></head><body><div class="top">BankSaathi</div><main class="wrap"><div class="box"><h1>Application Status</h1><p>अपना Application ID डालें।</p><input id="id" placeholder="Application ID"><button class="btn" onclick="check()">Check Status</button><div id="out"></div></div></main><script>async function check(){const id=document.getElementById('id').value.trim();const out=document.getElementById('out');if(!id){out.textContent='Application ID डालें';return}out.textContent='Checking...';try{const r=await fetch('/api/application-status?id='+encodeURIComponent(id));const j=await r.json();if(!r.ok){out.textContent=j.message||'Application नहीं मिली';return}const a=j.application;out.innerHTML='<div class="row"><b>Name:</b> '+a.name+'</div><div class="row"><b>Product:</b> '+(a.product||'-')+'</div><div class="row"><b>Agent ID:</b> '+(a.agent_id||'-')+'</div><div class="row"><b>Application Status:</b> '+a.status+'</div><div class="row"><b>Payment Status:</b> '+a.payment_status+'</div>'}catch(e){out.textContent='Status check नहीं हो सका'}}</script></body></html>
