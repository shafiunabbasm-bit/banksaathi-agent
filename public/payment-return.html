<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Status</title><style>body{font-family:Arial;background:#f3f7f5}.box{max-width:650px;margin:60px auto;background:white;padding:30px;border-radius:18px;text-align:center;box-shadow:0 5px 25px #0001}</style><div class="box"><h1>Payment Status</h1><p id="m">Payment verify हो रहा है...</p></div><script>(async()=>{const q=new URLSearchParams(location.search);const r=await fetch('/api/payment-status?order_id='+encodeURIComponent(q.get('order_id')||'')+'&application_id='+encodeURIComponent(q.get('application_id')||''));const j=await r.json();document.getElementById('m').textContent=j.paid?'Payment सफल है। Application status update हो गया है।':(j.message||('Payment status: '+(j.order_status||'Unknown')));})()</script></html>
