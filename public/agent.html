<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Agent Referral Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5f1;color:#12231c}.top{background:#063b2b;color:#fff;padding:18px 6%;font-size:25px;font-weight:800}.wrap{max-width:900px;margin:25px auto;padding:0 16px}.box{background:#fff;border-radius:18px;padding:25px;box-shadow:0 4px 20px #0001}.input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #cbd7d1;border-radius:9px;font-size:16px}.btn{display:inline-block;padding:12px 16px;border:0;border-radius:9px;background:#087b52;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;margin:4px}.link{padding:13px;background:#eef7f2;border-radius:9px;word-break:break-all;margin:14px 0}.qr{min-height:350px;display:flex;justify-content:center;align-items:center;background:#fff;margin:15px 0}.hint{font-size:14px;color:#596a62;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:5px}.success{padding:10px;background:#e8f7ef;border-radius:8px;font-weight:700}.error{padding:10px;background:#ffe9e9;border-radius:8px;font-weight:700;color:#a40000}</style></head><body><div class="top">BankSaathi • Agent Referral Center</div><div class="wrap"><div class="box"><h1>Agent Referral Link & QR</h1><p class="hint">Agent ID डालकर customer के लिए QR बनाएं। QR scan करने पर सीधे customer application खुलेगा और Agent ID अपने आप जुड़ जाएगी।</p><input class="input" id="agent" placeholder="Agent ID जैसे 38741106" inputmode="numeric"><select class="input" id="product"><option value="">सभी Products</option><option>Savings Account</option><option>Credit Card</option><option>Personal Loan</option><option>Banking Partner</option></select><button class="btn" id="make">Referral बनाएं</button><div id="link" class="link">Referral URL यहाँ आएगा</div><div id="ok" class="success" style="display:none">✓ QR तैयार है — mobile camera से scan करके check करें।</div><div id="err" class="error" style="display:none"></div><div class="actions"><button class="btn" id="copy" style="display:none">Link Copy</button><button class="btn" id="wa" style="display:none">WhatsApp पर भेजें</button><a class="btn" id="dash" style="display:none" href="/dashboard.html">Agent Dashboard</a></div><div class="qr" id="qrcode"></div><button class="btn" id="download" style="display:none">QR PNG Download</button></div></div><script>function make(){const a=agent.value.trim();if(!a){alert('Agent ID डालें');return}err.style.display='none';ok.style.display='none';qrcode.innerHTML='';const u=new URL('/apply.html',location.origin);u.searchParams.set('agent',a);if(product.value)u.searchParams.set('product',product.value);const url=u.href;link.textContent=url;copy.style.display=wa.style.display=dash.style.display=download.style.display='inline-block';copy.onclick=()=>navigator.clipboard.writeText(url).then(()=>copy.textContent='Copied ✓');wa.onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent('BankSaathi application link: '+url);dash.href='/dashboard.html?agent='+encodeURIComponent(a);const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data='+encodeURIComponent(url);const img=document.createElement('img');img.src=qrUrl;img.alt='BankSaathi Agent QR';img.width=320;img.height=320;img.onload=()=>{ok.style.display='block'};img.onerror=()=>{err.textContent='QR service load नहीं हो रही। नीचे दिया Referral Link इस्तेमाल करें।';err.style.display='block'};qrcode.appendChild(img);download.onclick=()=>{window.open(qrUrl,'_blank')}}make.onclick=make;const q=new URLSearchParams(location.search);if(q.get('agent')){agent.value=q.get('agent');if(q.get('product'))product.value=q.get('product');make()}</script></body></html>
