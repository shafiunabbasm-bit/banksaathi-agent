<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Shafiunabbas Financial Services</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8fc;font-family:Arial;color:#16243a}.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e2e9f2;border-radius:24px;padding:30px;box-shadow:0 15px 45px #152b4b18}h1{margin:0 0 8px;color:#0b5cff}.sub{color:#69768a;line-height:1.5}input,button{width:100%;height:46px;border-radius:12px;box-sizing:border-box;margin-top:10px;font-size:15px}input{border:1px solid #d9e1ec;padding:0 13px}button{border:0;background:#0b5cff;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:12px;font-size:13px;color:#69768a;min-height:20px}.back{display:block;text-align:center;margin-top:18px;color:#0b5cff;text-decoration:none}</style></head><body><main class="box"><h1>Customer Wallet</h1><p class="sub">Register / login with your mobile number using OTP.</p><form id="form"><input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Mobile Number" maxlength="10" required><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit OTP" hidden><button id="btn">Send OTP</button></form><div id="msg" class="msg"></div><a class="back" href="/">← Back to Shafiunabbas Financial Services</a></main><script>const mobile=document.getElementById("mobile"),code=document.getElementById("code"),btn=document.getElementById("btn"),msg=document.getElementById("msg");let step=0;document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";const value=mobile.value.replace(/\D/g,"");if(!/^[6-9]\d{9}$/.test(value)){msg.textContent="Enter a valid 10-digit Indian mobile number.";return}try{if(!step){const r=await fetch("/api/mobile-otp/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile:value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"OTP could not be sent.");step=1;code.hidden=false;code.required=true;btn.textContent="Verify OTP";msg.textContent="OTP sent to +91 "+value+"."}else{const r=await fetch("/api/mobile-otp/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile:value,otp:code.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Invalid OTP.");const next=new URLSearchParams(location.search).get("next");location.href=next&&next.startsWith("/")?next:"/#wallet"}}catch(err){msg.textContent=err.message||"Could not continue."}});</script></body></html>
