<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Payment QR</title><style>body{font-family:Arial;background:#f4f7fb;padding:30px}.box{max-width:600px;margin:auto;background:#fff;padding:25px;border-radius:16px}button{background:#0b5cff;color:#fff;border:0;padding:12px 18px;border-radius:10px;margin-top:15px}.status{margin-top:15px;white-space:pre-wrap}</style></head><body><div class="box"><h2>Upload Payment QR Code</h2><p>Select the exact QR image supplied for Shafiunabbas Financial Services.</p><input id="f" type="file" accept="image/jpeg"><br><button id="go">Upload QR Code</button><div id="s" class="status"></div></div><script>const token="qR9p4Y7m2X8k6L3s";async function b64(f){return new Promise((a,b)=>{const r=new FileReader();r.onload=()=>a(String(r.result).split(",")[1]);r.onerror=b;r.readAsDataURL(f)})}document.getElementById("go").onclick=async()=>{const s=document.getElementById("s"),f=document.getElementById("f").files[0];if(!f){s.textContent="Select the QR image first.";return}s.textContent="Uploading...";try{const data=await b64(f);const r=await fetch("/api/payment-qr-upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,data})});const j=await r.json();s.textContent=r.ok&&j.ok?"QR uploaded successfully.":"ERROR: "+(j.error||"Upload failed.");}catch(e){s.textContent="ERROR: "+e.message}};</script></body></html>
