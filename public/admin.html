<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#12231c}.top{background:#063b2b;color:#fff;padding:18px 6%;font-size:25px;font-weight:800}.wrap{padding:25px 5%;overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#e8f5ef}.btn{background:#0b7a53;color:#fff;border:0;padding:10px 15px;border-radius:7px;cursor:pointer}.msg{padding:20px;background:#fff;border-radius:12px;margin-bottom:15px}</style></head><body><div class="top">BankSaathi — Admin Dashboard</div><main class="wrap"><div id="msg" class="msg">Loading applications...</div><table><thead><tr><th>Application ID</th><th>Name</th><th>Phone</th><th>Product</th><th>Agent</th><th>Status</th><th>Payment</th><th>Date</th></tr></thead><tbody id="body"></tbody></table></main><script>async function load(){try{const r=await fetch('/api/admin-applications');if(!r.ok){document.getElementById('msg').textContent='Admin login required.';return}const j=await r.json();document.getElementById('msg').textContent='Total applications: '+j.applications.length;document.getElementById('body').innerHTML=j.applications.map(a=>'<tr><td>'+a.id+'</td><td>'+a.name+'</td><td>'+a.phone+'</td><td>'+a.product+'</td><td>'+a.agent_id+'</td><td>'+a.status+'</td><td>'+a.payment_status+'</td><td>'+new Date(a.created_at).toLocaleString('en-IN')+'</td></tr>').join('')}catch(e){document.getElementById('msg').textContent='Dashboard load नहीं हुआ'}}load()</script></body></html>
