<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f6f4;color:#14231d}.top{background:#063b2b;color:#fff;padding:18px 6%;font-size:25px;font-weight:800}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 15px #0001}.num{font-size:30px;font-weight:800;color:#087b52}.table{margin-top:20px;overflow:auto;background:#fff;border-radius:16px;padding:15px}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #ddd;text-align:left}a{color:#087b52;text-decoration:none}</style><div class="top">BankSaathi • Agent Dashboard</div><div class="wrap"><h1>Agent Dashboard</h1><input id="agent" placeholder="Agent ID" style="padding:13px;width:100%;border-radius:8px;border:1px solid #ccc"><button id="load" style="margin:10px 0;padding:12px 18px;background:#087b52;color:#fff;border:0;border-radius:8px">Dashboard देखें</button><div class="cards"><div class="card"><div class="num" id="total">0</div>Total Applications</div><div class="card"><div class="num" id="paid">0</div>Paid</div><div class="card"><div class="num" id="pending">0</div>Pending</div></div><div class="table"><table><thead><tr><th>ID</th><th>Product</th><th>Status</th><th>Payment</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>load.onclick=async()=>{const a=agent.value.trim();if(!a)return;const r=await fetch('/api/agent-applications?agent_id='+encodeURIComponent(a));const j=await r.json();if(!r.ok){alert(j.message||'Error');return}total.textContent=j.total;paid.textContent=j.paid;pending.textContent=j.pending;rows.innerHTML=j.applications.map(x=>'<tr><td>'+x.id+'</td><td>'+ (x.product||'')+'</td><td>'+x.status+'</td><td>'+x.payment_status+'</td><td>'+new Date(x.created_at).toLocaleDateString('en-IN')+'</td></tr>').join('')}</script></html>
