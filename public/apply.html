<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BankSaathi Full Customer Application</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef5f1;color:#14231d}.top{background:#063b2b;color:#fff;padding:18px 6%;font-size:24px;font-weight:800}.wrap{max-width:920px;margin:25px auto;padding:0 15px}.box{background:#fff;padding:25px;border-radius:18px;box-shadow:0 4px 20px #0001}.steps{display:flex;gap:5px;overflow:auto;margin-bottom:22px}.step{padding:9px 13px;border-radius:20px;background:#e8efeb;white-space:nowrap}.step.active{background:#087b52;color:white}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}.field label{display:block;font-weight:700;margin:7px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ccd8d2;border-radius:8px}.full{grid-column:1/-1}.actions{margin-top:20px;display:flex;justify-content:space-between;gap:10px}.btn{background:#087b52;color:white;border:0;border-radius:9px;padding:13px 20px;font-weight:700;cursor:pointer}.back{background:#65736c}.review{background:#f3f7f5;padding:15px;border-radius:10px;line-height:1.8}.msg{margin-top:15px;padding:13px;border-radius:9px;background:#eef7f2}</style><div class="top">BankSaathi • Full Customer Application</div><div class="wrap"><div class="box"><div class="steps"><div class="step active">1 Product</div><div class="step">2 Personal</div><div class="step">3 Address</div><div class="step">4 Income</div><div class="step">5 Nominee</div><div class="step">6 Review</div></div><form id="f"><div class="panel active"><h2>Product Selection</h2><div class="field"><label>Product *</label><select name="product" id="product" required><option>Savings Account</option><option>Current Account</option><option>Salary Account</option><option>Credit Card</option><option>Personal Loan</option><option>Business Loan</option><option>Insurance</option><option>Banking Partner</option></select></div></div><div class="panel"><h2>Personal Details</h2><div class="grid"><div class="field"><label>पूरा नाम *</label><input name="name" required></div><div class="field"><label>मोबाइल *</label><input name="phone" maxlength="10" inputmode="numeric" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>जन्म तारीख</label><input name="dob" type="date"></div><div class="field"><label>Gender</label><select name="gender"><option value="">चुनें</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>PAN</label><input name="pan" maxlength="10"></div><div class="field"><label>Aadhaar अंतिम 4 अंक</label><input name="aadhaar_last4" maxlength="4" inputmode="numeric"></div></div></div><div class="panel"><h2>Address</h2><div class="grid"><div class="field full"><label>पूरा पता</label><textarea name="address" rows="4"></textarea></div><div class="field"><label>शहर</label><input name="city"></div><div class="field"><label>राज्य</label><input name="state" value="Gujarat"></div><div class="field"><label>PIN Code</label><input name="pincode" maxlength="6" inputmode="numeric"></div></div></div><div class="panel"><h2>Employment & Income</h2><div class="grid"><div class="field"><label>Employment</label><select name="employment"><option value="">चुनें</option><option>Salaried</option><option>Self Employed</option><option>Business</option><option>Student</option><option>Other</option></select></div><div class="field"><label>Monthly Income</label><input name="monthly_income" type="number" min="0"></div></div></div><div class="panel"><h2>Nominee Details</h2><div class="grid"><div class="field"><label>Nominee Name</label><input name="nominee_name"></div><div class="field"><label>Relation</label><input name="nominee_relation"></div><div class="field"><label>Nominee Mobile</label><input name="nominee_phone" maxlength="10"></div></div></div><div class="panel"><h2>Review & Declaration</h2><div class="review" id="review"></div><p><label><input type="checkbox" id="consent"> मैं application processing के लिए अपनी जानकारी साझा करने की सहमति देता/देती हूँ। *</label></p><p><label><input type="checkbox" id="declaration"> मैंने दी गई जानकारी सही होने की घोषणा की है। *</label></p></div><input type="hidden" name="agent_id" id="agent_id"><input type="hidden" name="consent" value="true"><input type="hidden" name="declaration" value="true"><div class="actions"><button type="button" class="btn back" id="prev">Back</button><button type="button" class="btn" id="next">Next</button><button type="submit" class="btn" id="submit" style="display:none">Submit Application</button></div></form><div class="msg" id="msg"></div></div></div><script>const q=new URLSearchParams(location.search);if(q.get('agent'))agent_id.value=q.get('agent');if(q.get('product'))product.value=q.get('product');const panels=[...document.querySelectorAll('.panel')],steps=[...document.querySelectorAll('.step')];let n=0;function show(){panels.forEach((x,i)=>x.classList.toggle('active',i===n));steps.forEach((x,i)=>x.classList.toggle('active',i===n));prev.style.visibility=n?'visible':'hidden';next.style.display=n===panels.length-1?'none':'inline-block';submit.style.display=n===panels.length-1?'inline-block':'none';if(n===panels.length-1){const d=Object.fromEntries(new FormData(f));review.innerHTML=Object.entries(d).filter(([k,v])=>v&&k!=='consent'&&k!=='declaration').map(([k,v])=>'<b>'+k+':</b> '+v).join('<br>')}}show();next.onclick=()=>{if(n<panels.length-1){n++;show()}};prev.onclick=()=>{if(n>0){n--;show()}};f.onsubmit=async e=>{e.preventDefault();if(!consent.checked||!declaration.checked){msg.textContent='Consent और declaration दोनों स्वीकार करें';return}const d=Object.fromEntries(new FormData(f));d.consent=true;d.declaration=true;msg.textContent='Application जमा हो रही है...';const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){msg.textContent=j.message||'Application submit नहीं हुआ';return}msg.innerHTML='<b>Application सफलतापूर्वक जमा हुई</b><br>Application Number: <b>'+j.application_id+'</b><br><br><a href="/status.html?id='+encodeURIComponent(j.application_id)+'">Status देखें</a> &nbsp; <a href="/payment.html?application_id='+encodeURIComponent(j.application_id)+'&amount=1">Payment करें</a><br><small>Payment पर क्लिक करने पर Application ID अपने-आप आएगी। कुछ भी manually भरना नहीं है.</small>'};</script></html>
